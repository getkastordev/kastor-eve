version: 2

builds:
  - id: kastor-eve
    main: ./cmd/kastor-eve
    binary: kastor-eve
    env: [CGO_ENABLED=0]
    ldflags:
      - -s -w -X github.com/getkastordev/kastor-eve/internal/plugin.Version={{.Version}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
